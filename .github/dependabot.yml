version: 2

# Weekly, grouped dependency updates to cut PR noise while keeping the project
# current. Security updates still arrive immediately regardless of this schedule.
# Minor/patch bumps are grouped into two PRs (prod + dev); majors open on their
# own so they get individual review. Keep the pnpm.overrides discipline in the
# root package.json when merging.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
